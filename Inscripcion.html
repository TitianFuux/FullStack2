<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eSports Arena Manager — Inscripción</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="cabecera">
  <div class="contenedor">
    <a class="marca" href="inicio.html"> eSports Arena<span>Manager</span></a>
    <nav class="nav-principal" aria-label="Navegación principal">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="torneos.html">Torneos</a></li>
        <li><a href="inscripcion.html" aria-current="page">Inscripción</a></li>
        <li><a href="Gestion.HTML">Mi equipo</a></li>
        <li><a href="perfil.html">Perfil</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="contenido-principal">
  <section class="franja">
    <div class="contenedor">
      <h1>Inscripción a Torneo</h1>

      <div class="dos-columnas">
        <div>
          <article>
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" alt="Banner Oficial del Torneo" style="width:100%; max-height:220px; object-fit:cover; border-radius:var(--radio-borde); border:1px solid var(--color-borde); margin-bottom:1rem;">
            <div id="detalle-torneo"></div>
            <h2 style="margin-top:1.5rem;">Requisitos del Torneo</h2>
            <ul id="lista-requisitos" class="lista-integrantes"></ul>
          </article>

          <article style="margin-top:2rem;">
            <h2>Tráiler y Reglamento del Torneo</h2>
            <div class="marco-video">
              <iframe width="100%" height="320" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Tráiler del Torneo" style="border:0;" allowfullscreen></iframe>
            </div>
          </article>
        </div>

        <div>
          <h2>Formulario de Registro</h2>
          <form id="form-inscripcion" class="formulario" autocomplete="on" novalidate>
            <div class="campo">
              <label for="tipo-participante">¿Cómo se inscribirá?</label>
              <select name="tipoParticipante" id="tipo-participante" required>
                <option value="">Selecciona una opción</option>
                <option value="equipo">Equipo</option>
              </select>
              <span class="mensaje-error" id="error-tipo"></span>
            </div>

            <div class="campo" id="contenedor-selector-equipo" hidden>
              <label for="selector-equipo">Selecciona tu equipo</label>
              <select name="equipoId" id="selector-equipo"></select>
              <span class="mensaje-error" id="error-equipo"></span>
            </div>

            <p id="mensaje-bloqueo" class="mensaje-error" hidden></p>
            <button type="submit" id="btn-confirmar" class="boton boton-primario">Confirmar inscripción</button>
          </form>

          <div id="confirmacion" class="aviso aviso--exito oculto" style="margin-top:1rem;">
            <h2>¡Inscripción confirmada!</h2>
            <p id="detalle-confirmacion"></p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="pie">
  <div class="contenedor">
    <p>© 2026 eSports Arena Manager</p>
    <nav aria-label="Enlaces del pie de página">
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="torneos.html">Torneos</a></li>
      </ul>
    </nav>
  </div>
</footer>

<script src="js/datos.js"></script>
<script src="js/inscripcion.js"></script>
</body>
</html>
