<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gestión de equipo | eSports Arena Manager</title>
</head>
<body>

    <header>
        <nav>

        </nav>
    </header>

    <main>
        <section id="crear-equipo">
            <h1>Crear equipo</h1>
            <form id="form-equipo" autocomplete="on">

                <label for="nombre-equipo">Nombre del equipo</label>
                <input type="text" id="nombre-equipo" name="nombreEquipo" required minlength="3" autocomplete="off">
                <span class="mensaje-error" id="error-nombre"></span>

                <label for="juego-principal">Juego principal</label>
                <select id="juego-principal" name="juegoPrincipal" required>
                    <option value="">Selecciona un juego</option>
                </select>
                <span class="mensaje-error" id="error-juego"></span>

                <label for="capitan">Capitán</label>
                <select id="capitan" name="capitan" required>
                    <option value="">Selecciona un capitán</option>
                </select>
                <span class="mensaje-error" id="error-capitan"></span>

                <button type="submit">Crear equipo</button>
            </form>
        </section>

        <section id="integrantes-equipo">
            <h2>Integrantes del equipo</h2>

            <ul id="lista-integrantes"></ul>

            <label for="agregar-jugador">Agregar jugador</label>
            <select id="agregar-jugador"></select>
            <button type="button" id="btn-agregar">Agregar</button>
            <span class="mensaje-error" id="error-agregar"></span>
        </section>
    </main>

    <footer>
        <p>eSports Arena Manager — footer informativo</p>
    </footer>

    <script src="js/datos.js"></script>
    <script src="js/gestion-equipo.js"></script>
</body>
</html>
